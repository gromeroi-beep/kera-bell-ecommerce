<div class="login-container">

  <h2>Iniciar Sesión</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Correo</label>
      <input type="email" formControlName="email" placeholder="tu@correo.com">

      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
        Debes ingresar un correo válido.
      </small>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="********">

      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
        La contraseña debe tener mínimo 6 caracteres.
      </small>
    </div>

    <button [disabled]="isLoading" type="submit">
      {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </form>

</div>
