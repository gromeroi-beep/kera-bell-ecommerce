<ion-content class="login-bg" fullscreen>
  <div class="login-wrapper">
    
    <!-- CONTENEDOR PRINCIPAL -->
    <div class="login-container">

      <!-- LOGO CON ANIMACIÓN -->
      <div class="logo-container">
        <img src="assets/img/logo.png" class="logo" alt="Kera-Bell Logo" />
      </div>

      <!-- TÍTULOS -->
      <div class="header-section">
        <h1 class="title">Kera-Bell</h1>
        <p class="subtitle">Bienvenida a tu tienda de belleza ✨</p>
      </div>

      <!-- FORMULARIO -->
      <form [formGroup]="form" (ngSubmit)="login()" class="login-form">

        <!-- EMAIL INPUT -->
        <div class="form-group">
          <ion-item class="input-item" [class.focused]="emailFocused">
            <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              type="email"
              placeholder="Correo electrónico"
              formControlName="email"
              (ionFocus)="emailFocused = true"
              (ionBlur)="emailFocused = false"
              clearInput>
            </ion-input>
            <ion-icon 
              *ngIf="form.get('email')?.valid && form.get('email')?.value"
              name="checkmark-circle" 
              slot="end" 
              class="icon-success">
            </ion-icon>
          </ion-item>
          <!-- Error message -->
          <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-message">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span *ngIf="form.get('email')?.errors?.['required']">El correo es requerido</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Correo inválido</span>
          </div>
        </div>

        <!-- PASSWORD INPUT -->
        <div class="form-group">
          <ion-item class="input-item" [class.focused]="passwordFocused">
            <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              formControlName="password"
              (ionFocus)="passwordFocused = true"
              (ionBlur)="passwordFocused = false">
            </ion-input>
            <ion-button
              fill="clear"
              slot="end"
              (click)="togglePassword()"
              type="button"
              class="eye-button">
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
                class="eye-icon">
              </ion-icon>
            </ion-button>
          </ion-item>
          <!-- Error message -->
          <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-message">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>Mínimo 6 caracteres</span>
          </div>
        </div>

        <!-- BOTÓN LOGIN -->
        <ion-button 
          expand="block" 
          type="submit" 
          class="btn-login"
          [disabled]="form.invalid || isLoading"
          (click)="login()">
          <ion-spinner *ngIf="isLoading" name="crescent" class="spinner-button"></ion-spinner>
          <span *ngIf="!isLoading">Ingresar</span>
          <span *ngIf="isLoading">Validando...</span>
        </ion-button>

      </form>

      <!-- DIVIDER -->
      <div class="divider-section">
        <span class="divider-text">¿No tienes cuenta?</span>
      </div>

      <!-- REGISTRO LINK -->
      <div class="register-section">
        <p class="register-text">
          <a routerLink="/register" class="register-link">Regístrate aquí</a>
        </p>
      </div>


    </div>
  </div>
</ion-content>
