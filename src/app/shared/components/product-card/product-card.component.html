<ion-card>
  <ion-card-header>
    <ion-card-title>{{ product.name }}</ion-card-title>
    <ion-card-subtitle>S/ {{ product.price | number:'1.2-2' }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <img 
      *ngIf="product.imageUrl" 
      [src]="product.imageUrl" 
      alt="{{ product.name }}"
      style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;">
    
    <p>{{ product.description }}</p>
  </ion-card-content>

  <ion-button 
    expand="full" 
    color="primary" 
    (click)="viewProductDetail()">
    Ver Detalle / Añadir
  </ion-button>
</ion-card>
